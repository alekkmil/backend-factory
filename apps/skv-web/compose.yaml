services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skvuser
      POSTGRES_PASSWORD: skvpass
      POSTGRES_DB: skv_web_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - skv_web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skvuser -d skv_web_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  skv_web_postgres_data:
